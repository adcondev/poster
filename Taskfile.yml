# https://taskfile.dev

version: '3'

vars:
  POSTER: ./bin/poster
  RACE_FLAG:
    sh: |
      if go test -race ./internal/calculate >/dev/null 2>&1; then
        echo "-race"
      else
        echo ""
      fi
  TEST_FLAGS: '{{.TEST_FLAGS | default (printf "%s -coverprofile=coverage.txt -covermode=atomic" .RACE_FLAG) | trim}}'
  LINT_FLAGS: --timeout=5m
  BANNER: |
    ╔══════════════════════════════════════════════════════════╗
    ║                                                          ║
    ║   ██████╗  ██████╗ ███████╗████████╗███████╗██████╗      ║
    ║   ██╔══██╗██╔═══██╗██╔════╝╚══██╔══╝██╔════╝██╔══██╗     ║
    ║   ██████╔╝██║   ██║███████╗   ██║   █████╗  ██████╔╝     ║
    ║   ██╔═══╝ ██║   ██║╚════██║   ██║   ██╔══╝  ██╔══██╗     ║
    ║   ██║     ╚██████╔╝███████║   ██║   ███████╗██║  ██║     ║
    ║   ╚═╝      ╚═════╝ ╚══════╝   ╚═╝   ╚══════╝╚═╝  ╚═╝     ║
    ║                                                          ║
    ║            ESC/POS Thermal Printer Utility               ║
    ║         JSON Schema v1.0 · Windows Spooler · PNG         ║
    ║                                                          ║
    ╚══════════════════════════════════════════════════════════╝

includes:
  barcode:
    taskfile: ./pkg/commands/barcode/Taskfile.yml
    dir: ./pkg/commands/barcode
    aliases:
      - bc
  bitimage:
    taskfile: ./pkg/commands/bitimage/Taskfile.yml
    dir: ./pkg/commands/bitimage
    aliases:
      - bi
  character:
    taskfile: ./pkg/commands/character/Taskfile.yml
    dir: ./pkg/commands/character
    aliases:
      - ch
  linespacing:
    taskfile: ./pkg/commands/linespacing/Taskfile.yml
    dir: ./pkg/commands/linespacing
    aliases:
      - ls
  mechanismcontrol:
    taskfile: ./pkg/commands/mechanismcontrol/Taskfile.yml
    dir: ./pkg/commands/mechanismcontrol
    aliases:
      - mc
  print:
    taskfile: ./pkg/commands/print/Taskfile.yml
    dir: ./pkg/commands/print
    aliases:
      - pr
  printposition:
    taskfile: ./pkg/commands/printposition/Taskfile.yml
    dir: ./pkg/commands/printposition
    aliases:
      - pp
  qrcode:
    taskfile: ./pkg/commands/qrcode/Taskfile.yml
    dir: ./pkg/commands/qrcode
    aliases:
      - qr
  common:
    taskfile: ./pkg/commands/shared/Taskfile.yml
    dir: ./pkg/commands/shared
    aliases:
      - sh

tasks:
  default:
    cmds:
      - echo "{{.BANNER}}"
    silent: true
  build:
    deps:
      - test
      - lint
    cmds:
      - echo "Building the project..."
      - go build -o {{.POSTER}} ./cmd/poster
  lint:
    cmds:
      - echo "Running linters..."
      - golangci-lint run {{.LINT_FLAGS}}
  test:
    cmds:
      - echo "Running all tests in detail..."
      - go test {{.TEST_FLAGS}} ./...
  deps:
    cmds:
      - echo "Tidying and downloading dependencies..."
      - go mod tidy
      - go mod download
  poster:
    desc: Process an existing ticket JSON file
    preconditions:
      - sh: test -f {{.CLI_ARGS | q}}
        msg: "File '{{.CLI_ARGS}}' does not exist or was not specified."
    cmds:
      - "{{.POSTER}} {{.CLI_ARGS | q}}"